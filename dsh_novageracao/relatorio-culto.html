<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Culto | Nova Geração</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/global.css">

    <link rel="icon" type="image/png" href="../assets/img/logo/novo_logo_coracao.png" />
</head>

<body>

    <div class="app">

        <div id="sidebar-container"></div>

        <div class="main-content">

            <div id="header-container"></div>

            <div class="page-content">

                <div class="page-header">
                    <div class="page-header__content">
                        <h1 class="page-header__title">Relatório de Culto</h1>
                        <p class="page-header__description">Registre a presença de cada culto realizado.</p>
                    </div>
                    <div class="page-header__actions">
                        <button class="btn btn--primary" id="btnNovoRelatorio">
                            <i class="fa-solid fa-plus"></i> Novo Registro
                        </button>
                    </div>
                </div>

                <div class="data-table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Ações</th>
                                <th>Data do Culto</th>
                                <th>Pastor(a) Responsável</th>
                                <th>Qtd. Participantes</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaPresencas"></tbody>
                    </table>
                </div>

            </div>

        </div>

    </div>

    <!-- MODAL: PRESENÇA -->
    <div class="modal-root" id="modalPresenca">
        <div class="modal-backdrop" data-fechar-modal></div>
        <div class="modal modal--small">
            <div class="modal__header">
                <div class="modal__header-content">
                    <span class="modal__icon"><i class="fa-solid fa-clipboard-list"></i></span>
                    <div>
                        <h3 class="modal__title" id="modalPresencaTitulo">Novo Registro</h3>
                        <p class="modal__subtitle">Preencha os dados do culto</p>
                    </div>
                </div>
                <button class="modal__close" data-fechar-modal><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="formPresenca">
                <div class="modal__body">

                    <div class="form-group">
                        <label class="form-label">Data do Culto <span class="required">*</span></label>
                        <input type="date" name="dataCulto" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Pastor(a) Responsável <span class="required">*</span></label>
                        <input type="text" name="pastor" class="form-control" placeholder="Nome do pastor(a)" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Quantidade de Pessoas Presentes <span
                                class="required">*</span></label>
                        <input type="number" name="quantidade" class="form-control" min="0" placeholder="Ex: 120"
                            required>
                    </div>

                </div>

                <div class="modal__footer">
                    <button type="button" class="btn btn--ghost" data-fechar-modal>Cancelar</button>
                    <button type="submit" class="btn btn--primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="assets/js/store.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/relatorio-culto.js"></script>

</body>

</html>
