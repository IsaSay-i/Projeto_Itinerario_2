<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batismo | Nova Geração</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="icon" type="image/png" href="../assets/img/logo/novo_logo_coracao.png" />
</head>

<body>

    <div class="app">

        <div id="sidebar-container"></div>

        <div class="main-content">

            <div id="header-container"></div>

            <div class="page-content">

                <div class="page-header">
                    <div class="page-header__content">
                        <h1 class="page-header__title">Batismo</h1>
                        <p class="page-header__description">Cadastre e acompanhe os candidatos ao batismo.</p>
                    </div>
                    <div class="page-header__actions">
                        <button class="btn btn--primary" id="btnNovoBatismo">
                            <i class="fa-solid fa-plus"></i> Novo Batismo
                        </button>
                    </div>
                </div>

                <div class="data-table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Ações</th>
                                <th>Nome</th>
                                <th>Data de Nascimento</th>
                                <th>Data do Batismo</th>
                                <th>Contato</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaBatismos"></tbody>
                    </table>
                </div>

            </div>

        </div>

    </div>

    <!-- MODAL: BATISMO -->
    <div class="modal-root" id="modalBatismo">
        <div class="modal-backdrop" data-fechar-modal></div>
        <div class="modal modal--small">
            <div class="modal__header">
                <div class="modal__header-content">
                    <span class="modal__icon"><i class="fa-solid fa-water"></i></span>
                    <div>
                        <h3 class="modal__title" id="modalBatismoTitulo">Novo Batismo</h3>
                        <p class="modal__subtitle">Preencha os dados do candidato</p>
                    </div>
                </div>
                <button class="modal__close" data-fechar-modal><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="formBatismo">
                <div class="modal__body">

                    <div class="form-group">
                        <label class="form-label">Nome <span class="required">*</span></label>
                        <input type="text" name="nome" class="form-control" placeholder="Nome completo" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Data de Nascimento <span class="required">*</span></label>
                            <input type="date" name="dataNascimento" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Data do Batismo <span class="required">*</span></label>
                            <input type="date" name="dataBatismo" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Contato <span class="required">*</span></label>
                        <input type="tel" name="contato" class="form-control" placeholder="(00) 00000-0000" required>
                    </div>

                </div>

                <div class="modal__footer">
                    <button type="button" class="btn btn--ghost" data-fechar-modal>Cancelar</button>
                    <button type="submit" class="btn btn--primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="assets/js/store.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/batismo.js"></script>

</body>

</html>
